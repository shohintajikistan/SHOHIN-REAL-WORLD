name: Build SHOHIN 3D assets with Blender
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "tools/blender/**"
      - ".github/workflows/blender-assets.yml"
permissions:
  contents: write
jobs:
  blender-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
      - name: Generate forest models
        run: blender --background --python tools/blender/build_world.py
      - name: Commit generated GLB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/forest_pack.glb
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Build procedural forest asset pack"; git push; fi
