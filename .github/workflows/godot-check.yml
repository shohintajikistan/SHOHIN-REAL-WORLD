name: Validate SHOHIN Godot 4 project

on:
  push:
    branches: ["main"]
    paths:
      - "godot/**"
      - ".github/workflows/godot-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Godot 4.4.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
      - name: Validate project and scripts
        run: |
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --editor --quit
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --quit-after 3
