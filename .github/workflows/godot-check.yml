name: Validate SHOHIN Three.js game

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "assets/**"
      - ".github/workflows/godot-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Three.js entry point
        run: |
          test -s index.html
          grep -q 'three@0.180.0/build/three.module.js' index.html
          grep -q 'new THREE.WebGLRenderer' index.html
          grep -q 'function gather()' index.html
          grep -q 'function openPanel(type)' index.html
          echo "Three.js game entry point and core survival systems found."
