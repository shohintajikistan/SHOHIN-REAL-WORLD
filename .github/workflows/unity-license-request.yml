name: Get Unity Personal license request
on:
  workflow_dispatch:

jobs:
  activation:
    name: Create Unity license request file
    runs-on: ubuntu-latest
    steps:
      - name: Create activation request
        id: request
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.0.32f1
      - name: Upload activation request
        uses: actions/upload-artifact@v4
        with:
          name: Unity-activation-request
          path: ${{ steps.request.outputs.filePath }}
          if-no-files-found: error
