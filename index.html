<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#071c16">
<title>SHOHIN REAL WORLD</title>
<style>
:root{--bg:#071c16;--panel:#0d3024;--green:#08a56c;--lime:#baf05b;--white:#eef8f1}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071c16;color:var(--white);font-family:Inter,system-ui,Arial;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block}
#top{position:fixed;top:env(safe-area-inset-top,10px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:3}
.brand{background:#071c16cc;border:1px solid #baf05b55;border-radius:14px;padding:9px 12px;backdrop-filter:blur(10px)}
.brand b{letter-spacing:2px;color:var(--lime);font-size:13px}.brand small{display:block;color:#c6d9ce;font-size:9px;letter-spacing:1.5px;margin-top:2px}
#status{font-size:11px;color:#d5e9dc;text-align:right;background:#071c16bb;padding:8px 10px;border-radius:12px}
#hint{position:fixed;top:76px;left:50%;transform:translateX(-50%);font-size:11px;color:#e9f5ed;background:#071c16a8;padding:7px 12px;border-radius:20px;white-space:nowrap;pointer-events:none}
#controls{position:fixed;inset:auto 0 0;height:190px;pointer-events:none;z-index:4}
#stick{position:absolute;left:22px;bottom:22px;width:116px;height:116px;border-radius:50%;background:#071c1677;border:1px solid #baf05b66;pointer-events:auto;touch-action:none}
#nub{position:absolute;width:48px;height:48px;border-radius:50%;left:33px;top:33px;background:#08a56cdd;border:2px solid #baf05b;box-shadow:0 3px 18px #0008}
#actions{position:absolute;right:18px;bottom:26px;display:flex;flex-direction:column;gap:10px;pointer-events:auto}
.action{width:58px;height:58px;border-radius:50%;border:1px solid #baf05b99;background:#0d3024dd;color:#fff;font-size:12px;font-weight:700;touch-action:manipulation}
.action:active{background:#08a56c}
#panel{position:fixed;left:12px;right:12px;bottom:158px;z-index:5;background:#071c16eF;border:1px solid #08a56c88;border-radius:16px;padding:12px;backdrop-filter:blur(14px);display:none}
#panel.open{display:block}
#panel strong{color:var(--lime);font-size:13px}
#panel p{font-size:11px;color:#c6d9ce;margin:5px 0 9px}
#commandRow{display:flex;gap:7px}
#command{min-width:0;flex:1;background:#0d3024;border:1px solid #426b59;border-radius:10px;padding:11px;color:#fff;font-size:13px;outline:none}
#send{background:#08a56c;border:0;border-radius:10px;color:white;padding:0 15px;font-weight:700}
#toast{position:fixed;left:50%;bottom:205px;transform:translateX(-50%);z-index:8;background:#0d3024ed;border:1px solid #baf05b66;border-radius:12px;padding:10px 14px;font-size:12px;display:none;max-width:85%;text-align:center}
#loading{position:fixed;inset:0;z-index:20;background:#071c16;display:grid;place-items:center;text-align:center;transition:opacity .5s}
#loading b{font-size:23px;letter-spacing:4px;color:var(--lime)}#loading span{display:block;color:#b8cfc2;font-size:11px;margin-top:10px;letter-spacing:2px}
#cross{position:fixed;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:#fff9;pointer-events:none}
@media(min-width:800px){#controls{height:150px}#stick{width:100px;height:100px}#nub{left:26px;top:26px}#hint{top:85px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="loading"><div><b>SHOHIN</b><span>BUILDING YOUR WORLD...</span></div></div>
<div id="top"><div class="brand"><b>SHOHIN REAL WORLD</b><small>OPEN WORLD • EARLY ACCESS</small></div><div id="status">Загрузка мира...</div></div>
<div id="hint">Двигай джойстик • Проведи пальцем по экрану — осмотрись</div>
<div id="cross"></div>
<div id="controls">
 <div id="stick"><div id="nub"></div></div>
 <div id="actions"><button class="action" id="jump">ПРЫЖОК</button><button class="action" id="build">МИР +</button></div>
</div>
<div id="panel"><strong>СТРОИТЕЛЬСТВО МИРА</strong><p>Напиши, что добавить. Например: «создай лес», «построй дом», «добавь озеро», «создай животных».</p><div id="commandRow"><input id="command" placeholder="Что построить в мире?"><button id="send">СОЗДАТЬ</button></div></div>
<div id="toast"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const mount=document.querySelector('#game');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ac8d0);scene.fog=new THREE.Fog(0x9ac8d0,38,125);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;mount.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdaf4ff,0x526b37,2.0));
const sun=new THREE.DirectionalLight(0xfff1d2,2.4);sun.position.set(-35,55,25);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-45;sun.shadow.camera.right=45;sun.shadow.camera.top=45;sun.shadow.camera.bottom=-45;scene.add(sun);
const mat=(color,roughness=1)=>new THREE.MeshStandardMaterial({color,roughness});
const grass=mat(0x578b45),darkGrass=mat(0x376d3c),trunk=mat(0x765039),leaf1=mat(0x267448),leaf2=mat(0x398b4d),stone=mat(0x858d82),wood=mat(0x9b6840),roof=mat(0x674b3b),wall=mat(0xd8c99d),water=new THREE.MeshStandardMaterial({color:0x3d9da4,roughness:.25,metalness:.12});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(260,260,1,1),grass);ground.rotation.x=-Math.PI/2;ground.position.y=-.15;ground.receiveShadow=true;scene.add(ground);
const grid=new THREE.GridHelper(260,52,0x69956a,0x69956a);grid.position.y=-.13;grid.material.transparent=true;grid.material.opacity=.10;scene.add(grid);
function addTree(x,z,s=1){const g=new THREE.Group();const t=new THREE.Mesh(new THREE.CylinderGeometry(.17*s,.24*s,1.8*s,7),trunk);t.position.y=.9*s;t.castShadow=true;g.add(t);for(let i=0;i<3;i++){const c=new THREE.Mesh(new THREE.ConeGeometry((1.05-i*.12)*s,1.65*s,7),i%2?leaf1:leaf2);c.position.y=(1.75+i*.55)*s;c.castShadow=true;g.add(c)}g.position.set(x,0,z);scene.add(g);return g}
function addHouse(x,z){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(3.8,2.5,3.2),wall);b.position.y=1.25;b.castShadow=true;b.receiveShadow=true;g.add(b);const r=new THREE.Mesh(new THREE.ConeGeometry(2.9,1.7,4),roof);r.rotation.y=Math.PI/4;r.position.y=3.25;r.castShadow=true;g.add(r);const door=new THREE.Mesh(new THREE.BoxGeometry(.8,1.5,.12),wood);door.position.set(0,.75,1.66);g.add(door);const winmat=new THREE.MeshStandardMaterial({color:0x78b6c2,metalness:.2});for(const xx of [-1.15,1.15]){const w=new THREE.Mesh(new THREE.BoxGeometry(.65,.65,.1),winmat);w.position.set(xx,1.55,1.66);g.add(w)}g.position.set(x,0,z);scene.add(g);return g}
function addRock(x,z,s=1){const m=new THREE.Mesh(new THREE.DodecahedronGeometry(.7*s,0),stone);m.position.set(x,.35*s,z);m.scale.y=.7;m.castShadow=true;scene.add(m)}
function addLake(x,z,r=5){const m=new THREE.Mesh(new THREE.CircleGeometry(r,40),water);m.rotation.x=-Math.PI/2;m.position.set(x,.015,z);scene.add(m);return m}
const world={trees:[],houses:[],animals:[],npcs:[],rocks:[],lakes:[]};
for(let i=0;i<95;i++){const x=(Math.random()-.5)*100,z=(Math.random()-.5)*100;if(Math.hypot(x,z)>9)world.trees.push(addTree(x,z,.65+Math.random()*.65))}
for(const [x,z] of [[9,-8],[-12,-10],[15,13]])world.houses.push(addHouse(x,z));
for(let i=0;i<24;i++){const a=Math.random()*Math.PI*2,r=7+Math.random()*45;addRock(Math.cos(a)*r,Math.sin(a)*r,.5+Math.random()*.7)}
addLake(-20,13,7);world.lakes.push(1);
const player=new THREE.Group();
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.9,4,8),mat(0x087b53));body.position.y=1.05;body.castShadow=true;player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.29,12,10),mat(0xe0b58c));head.position.y=1.85;head.castShadow=true;player.add(head);
const hair=new THREE.Mesh(new THREE.SphereGeometry(.3,10,7,0,Math.PI*2,0,Math.PI/2),mat(0x29251e));hair.position.y=2.02;player.add(hair);
const legs=[];for(const x of [-.19,.19]){const l=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.55,3,6),mat(0x253d36));l.position.set(x,.38,0);player.add(l);legs.push(l)}
player.position.set(0,0,0);scene.add(player);
function makeAnimal(x,z,type='deer'){const g=new THREE.Group();const fur=mat(type==='deer'?0xb77b43:0xe2e0d2);const torso=new THREE.Mesh(new THREE.SphereGeometry(.55,12,9),fur);torso.scale.set(1,.75,1.35);torso.position.y=.8;g.add(torso);const neck=new THREE.Mesh(new THREE.CylinderGeometry(.16,.24,.65,8),fur);neck.position.set(0,1.12,.43);neck.rotation.x=-.35;g.add(neck);const h=new THREE.Mesh(new THREE.SphereGeometry(.23,10,8),fur);h.position.set(0,1.47,.63);g.add(h);for(const sx of [-.27,.27])for(const sz of [-.35,.35]){const leg=new THREE.Mesh(new THREE.CylinderGeometry(.055,.075,.55,6),fur);leg.position.set(sx,.32,sz);g.add(leg)}if(type==='deer'){for(const sx of [-.13,.13]){const horn=new THREE.Mesh(new THREE.CylinderGeometry(.025,.045,.45,5),mat(0x55402a));horn.position.set(sx,1.8,.62);horn.rotation.z=sx>0?-.25:.25;g.add(horn)}}g.position.set(x,0,z);scene.add(g);world.animals.push({mesh:g,origin:new THREE.Vector3(x,0,z),phase:Math.random()*6,speed:.4+Math.random()*.5});return g}
function makeNpc(x,z){const g=new THREE.Group();const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.35,.8,4,7),mat([0x345e9b,0x9a593b,0x7c4d8e][Math.floor(Math.random()*3)]));torso.position.y=1;g.add(torso);const h=new THREE.Mesh(new THREE.SphereGeometry(.25,10,8),mat(0xc99570));h.position.y=1.72;g.add(h);g.position.set(x,0,z);scene.add(g);world.npcs.push({mesh:g,origin:new THREE.Vector3(x,0,z),phase:Math.random()*6});return g}
for(let i=0;i<7;i++)makeAnimal((Math.random()-.5)*48,(Math.random()-.5)*48,i%3===0?'sheep':'deer');
for(let i=0;i<5;i++)makeNpc((Math.random()-.5)*34,(Math.random()-.5)*34);
let yaw=0,pitch=.22,moveX=0,moveY=0,velocityY=0,onGround=true,walking=0;
const clock=new THREE.Clock();let toastTimer;
function toast(s){const el=document.querySelector('#toast');el.textContent=s;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',2400)}
function moveObject(g,x,z){g.position.set(x,0,z)}
function buildFromText(raw){const s=raw.toLowerCase().trim();if(!s)return;let count=0;
if(/лес|дерев|forest/.test(s)){for(let i=0;i<28;i++){const a=Math.random()*Math.PI*2,r=8+Math.random()*18;world.trees.push(addTree(player.position.x+Math.cos(a)*r,player.position.z+Math.sin(a)*r,.7+Math.random()*.7))}toast('Лес создан: добавлено 28 деревьев.');count=1}
else if(/дом|house|здани/.test(s)){const x=player.position.x+Math.sin(yaw)*7,z=player.position.z+Math.cos(yaw)*7;world.houses.push(addHouse(x,z));toast('Дом построен рядом с тобой.');count=1}
else if(/озер|вод|lake/.test(s)){addLake(player.position.x+8,player.position.z+5,6);toast('Добавлено небольшое озеро.');count=1}
else if(/живот|олень|овц|коров|animal/.test(s)){for(let i=0;i<5;i++)makeAnimal(player.position.x+(Math.random()-.5)*14,player.position.z+(Math.random()-.5)*14,i%2?'sheep':'deer');toast('В мире появились 5 животных.');count=1}
else if(/человек|люд|жител|npc/.test(s)){for(let i=0;i<4;i++)makeNpc(player.position.x+(Math.random()-.5)*12,player.position.z+(Math.random()-.5)*12);toast('Добавлено 4 жителя.');count=1}
else if(/кам|скал|rock/.test(s)){for(let i=0;i<12;i++)addRock(player.position.x+(Math.random()-.5)*18,player.position.z+(Math.random()-.5)*18,.6+Math.random());toast('Добавлены камни.');count=1}
else toast('Пока доступны команды: лес, дом, озеро, животные, люди, камни.');return count}
document.querySelector('#send').onclick=()=>{buildFromText(document.querySelector('#command').value);document.querySelector('#command').value=''};
document.querySelector('#command').addEventListener('keydown',e=>{if(e.key==='Enter')document.querySelector('#send').click()});
document.querySelector('#build').onclick=()=>document.querySelector('#panel').classList.toggle('open');
document.querySelector('#jump').onclick=()=>{if(onGround){velocityY=7;onGround=false}};
const stick=document.querySelector('#stick'),nub=document.querySelector('#nub');let stickId=null;
function stickMove(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=37,d=Math.hypot(dx,dy);if(d>max){dx=dx/d*max;dy=dy/d*max}nub.style.transform='translate('+dx+'px,'+dy+'px)';moveX=dx/max;moveY=dy/max}
stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture(stickId);stickMove(e)});
stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)stickMove(e)});
function stopStick(){stickId=null;moveX=moveY=0;nub.style.transform='translate(0,0)'}
stick.addEventListener('pointerup',stopStick);stick.addEventListener('pointercancel',stopStick);
let lookId=null,lastX=0,lastY=0;
renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)}else if(e.clientX>innerWidth*.35){lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY}});
renderer.domElement.addEventListener('pointermove',e=>{if(lookId===e.pointerId){yaw-=(e.clientX-lastX)*.005;pitch=Math.max(-.05,Math.min(.75,pitch+(e.clientY-lastY)*.003));lastX=e.clientX;lastY=e.clientY}});
renderer.domElement.addEventListener('pointerup',e=>{if(lookId===e.pointerId)lookId=null});renderer.domElement.addEventListener('pointercancel',()=>lookId=null);
addEventListener('keydown',e=>{if(e.code==='KeyW'||e.code==='ArrowUp')moveY=-1;if(e.code==='KeyS'||e.code==='ArrowDown')moveY=1;if(e.code==='KeyA'||e.code==='ArrowLeft')moveX=-1;if(e.code==='KeyD'||e.code==='ArrowRight')moveX=1;if(e.code==='Space'&&onGround){velocityY=7;onGround=false}});
addEventListener('keyup',e=>{if(['KeyW','ArrowUp','KeyS','ArrowDown'].includes(e.code))moveY=0;if(['KeyA','ArrowLeft','KeyD','ArrowRight'].includes(e.code))moveX=0});
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04),t=clock.elapsedTime;
const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
const dir=forward.clone().multiplyScalar(-moveY).add(right.multiplyScalar(moveX));if(dir.lengthSq()>1)dir.normalize();
if(dir.lengthSq()>.001){player.position.addScaledVector(dir,5.2*dt);player.rotation.y=Math.atan2(dir.x,dir.z);walking+=dt*10}else walking=0;
velocityY-=18*dt;player.position.y+=velocityY*dt;if(player.position.y<0){player.position.y=0;velocityY=0;onGround=true}
legs[0].rotation.x=Math.sin(walking)*.65;legs[1].rotation.x=-Math.sin(walking)*.65;
for(const a of world.animals){a.phase+=dt*a.speed;a.mesh.position.x=a.origin.x+Math.sin(a.phase*.55)*1.8;a.mesh.position.z=a.origin.z+Math.cos(a.phase*.42)*1.8;a.mesh.rotation.y=Math.atan2(Math.cos(a.phase*.55),-Math.sin(a.phase*.42));}
for(const n of world.npcs){n.phase+=dt*.45;n.mesh.position.x=n.origin.x+Math.sin(n.phase)*1.5;n.mesh.position.z=n.origin.z+Math.cos(n.phase*.7)*1.5;n.mesh.rotation.y=Math.atan2(Math.cos(n.phase),-Math.sin(n.phase*.7));}
const target=new THREE.Vector3(player.position.x,player.position.y+1.4,player.position.z);
const offset=new THREE.Vector3(Math.sin(yaw)*8,3.6+pitch*3,Math.cos(yaw)*8);camera.position.lerp(target.clone().add(offset),1-Math.pow(.001,dt));camera.lookAt(target);
document.querySelector('#status').textContent='X '+player.position.x.toFixed(0)+'  •  Z '+player.position.z.toFixed(0)+'  •  '+(world.animals.length)+' животных';
renderer.render(scene,camera)}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6))});
setTimeout(()=>{const l=document.querySelector('#loading');l.style.opacity='0';setTimeout(()=>l.remove(),550);toast('Мир SHOHIN готов. Исследуй его!')},700);
</script>
</body>
</html>
