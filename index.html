const flowerGroups=flowerMats.map(m=>new THREE.InstancedMesh(flowerGeo,m,95));
const flowerCounts=[0,0,0];
for(let i=0;i<1500&&flowerCounts.some(n=>n<95);i++){
 const x=(Math.random()-.5)*108,z=(Math.random()-.5)*108;
 if(!isLand(x,z,5)||Math.hypot(x,z)<10)continue;
 const k=Math.floor(Math.random()*3);if(flowerCounts[k]>=95)continue;
 dummy.position.set(x,terrainHeight(x,z)+.11,z);const sc=.65+Math.random()*.8;
 dummy.scale.set(sc,sc,sc);dummy.rotation.set(0,Math.random()*6.28,0);dummy.updateMatrix();
 flowerGroups[k].setMatrixAt(flowerCounts[k]++,dummy.matrix);
}
flowerGroups.forEach((g,i)=>{g.count=flowerCounts[i];g.instanceMatrix.needsUpdate=true;scene.add(g);});
// Pebbles and layered coastal boulders make the beach transition less uniform.
const pebbleMats=[mat(0x9b927c),mat(0x6d766e),mat(0xb6a88d)];
const pebbleGroups=pebbleMats.map(m=>new THREE.InstancedMesh(new THREE.IcosahedronGeometry(.22,0),m,120));
const pebbleCounts=[0,0,0];
for(let i=0;i<1700&&pebbleCounts.some(n=>n<120);i++){
 const a=Math.random()*Math.PI*2,r=islandRadius(a)-2-Math.random()*8;
 const x=Math.cos(a)*r,z=Math.sin(a)*r;
 if(!isLand(x,z,0))continue;
 const k=Math.floor(Math.random()*3);if(pebbleCounts[k]>=120)continue;
 dummy.position.set(x,terrainHeight(x,z)+.13,z);
 dummy.scale.set(.5+Math.random()*1.3,.35+Math.random()*.55,.5+Math.random()*1.2);
 dummy.rotation.set(Math.random(),Math.random()*6.28,Math.random());
 dummy.updateMatrix();pebbleGroups[k].setMatrixAt(pebbleCounts[k]++,dummy.matrix);
}
pebbleGroups.forEach((g,i)=>{g.count=pebbleCounts[i];g.instanceMatrix.needsUpdate=true;scene.add(g);});
// A few larger rock faces reinforce the island's mountainous silhouette.
const summitMat=mat(0x69756b),summitShade=mat(0x4e5d53);
for(const peak of [{x:8,z:-18,h:10,r:5},{x:-24,z:4,h:7.5,r:4.5},{x:25,z:13,h:6.5,r:3.8},{x:-5,z:29,h:5.5,r:3.5}]){
 if(!isLand(peak.x,peak.z,3))continue;
 for(let j=0;j<5;j++){
  const a=j*Math.PI*2/5,rr=peak.r*(.3+Math.random()*.55);
  const b=new THREE.Mesh(new THREE.DodecahedronGeometry(1,1),j%2?summitMat:summitShade);
  const h=peak.h*(.55+Math.random()*.65);
  b.position.set(peak.x+Math.cos(a)*rr,terrainHeight(peak.x,peak.z)+h*.38,peak.z+Math.sin(a)*rr);
  b.scale.set(peak.r*(.65+Math.random()*.55),h,peak.r*(.6+Math.random()*.5));
  b.rotation.set(Math.random()*.25,Math.random()*6.28,Math.random()*.2);
  b.castShadow=true;b.receiveShadow=true;scene.add(b);
 }
}
// Distant low islands break the flat horizon and make the sea feel wider.
const farIslandMat=mat(0x526d59);
for(let i=0;i<7;i++){
 const a=i/7*Math.PI*2+.3,dist=105+Math.random()*28,x=Math.cos(a)*dist,z=Math.sin(a)*dist;
 const base=new THREE.Mesh(new THREE.CylinderGeometry(7+Math.random()*5,13+Math.random()*7,5,9),farIslandMat);
 base.position.set(x,-2.1,z);base.scale.y=.8;base.receiveShadow=true;scene.add(base);
 const crown=new THREE.Mesh(new THREE.ConeGeometry(8+Math.random()*5,8+Math.random()*7,8),farIslandMat);
 crown.position.set(x,2.2,z);crown.rotation.y=Math.random()*6.28;scene.add(crown);
}


const mapPanel=document.querySelector('#mapPanel'),mapCanvas=document.querySelector('#mapCanvas'),mapCtx=mapCanvas.getContext('2d');
document.querySelector('#mapBtn').onclick=()=>{mapPanel.style.display=mapPanel.style.display==='block'?'none':'block';drawMap()};
document.querySelector('#mapClose').onclick=()=>mapPanel.style.display='none';
function drawMap(){
 const c=mapCtx,w=400,h=400,cx=200,cy=200,scale=2.05;
 c.clearRect(0,0,w,h);const sea=c.createLinearGradient(0,0,400,400);sea.addColorStop(0,'#0b5264');sea.addColorStop(.5,'#16899a');sea.addColorStop(1,'#063b50');c.fillStyle=sea;c.fillRect(0,0,w,h);
 // subtle sea depth rings
 for(let r=175;r>20;r-=28){c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.strokeStyle='rgba(150,225,220,.12)';c.lineWidth=2;c.stroke()}
 c.save();c.translate(cx,cy);c.beginPath();
 for(let i=0;i<=240;i++){const a=i/240*Math.PI*2,r=islandRadius(a)*scale,x=Math.cos(a)*r,y=Math.sin(a)*r;if(i===0)c.moveTo(x,y);else c.lineTo(x,y)}
 c.closePath();c.save();c.shadowColor='#061e1a';c.shadowBlur=18;c.shadowOffsetY=5;c.fillStyle='#d7c18d';c.fill();c.restore();c.fillStyle='#426f3d';c.fill();c.lineWidth=3;c.strokeStyle='#e6d09b';c.stroke();
 // rough elevation shading
 c.save();c.clip();for(let i=0;i<12;i++){c.beginPath();c.ellipse(18,-24,28+i*8,17+i*6,-.42,0,Math.PI*2);c.fillStyle=i%2?'rgba(22,67,40,.13)':'rgba(181,194,112,.09)';c.fill()}for(let i=0;i<85;i++){const a=(i*2.399)%6.283,rr=18+(i%13)*4.7,x=Math.cos(a)*rr,y=Math.sin(a)*rr;c.beginPath();c.arc(x,y,1.8+(i%3),0,Math.PI*2);c.fillStyle='rgba(18,55,33,.34)';c.fill()}
 c.fillStyle='#3b9ba5';c.beginPath();c.arc(-18*scale,12*scale,6*scale,0,Math.PI*2);c.fill();
 c.fillStyle='#b9d7a0';for(const r of resources){if(!r.alive)continue;const x=r.mesh.position.x*scale,y=r.mesh.position.z*scale;c.globalAlpha=.42;c.fillRect(x-1,y-1,2,2)}c.globalAlpha=1;
 c.restore();
 // player arrow
 const px=player.position.x*scale,pz=player.position.z*scale;c.translate(px,pz);c.rotate(-yaw);c.beginPath();c.moveTo(0,-13);c.lineTo(9,10);c.lineTo(0,6);c.lineTo(-9,10);c.closePath();c.fillStyle='#baf05b';c.fill();c.lineWidth=3;c.strokeStyle='#09251b';c.stroke();
 c.restore();
 c.fillStyle='#eff8ed';c.font='bold 15px system-ui';c.fillText('N',cx-6,24);c.font='10px system-ui';c.fillStyle='rgba(239,248,237,.8)';c.fillText('SHOHIN ISLAND',12,386);
}

// Optional external Blender GLB loading is disabled for reliable startup.
animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5))});setTimeout(()=>{const l=document.querySelector('#loading');l.style.opacity='0';setTimeout(()=>l.remove(),550);toast('Выживай: добывай дерево и камень, создавай инструменты и строй укрытие.');},800);
</script></body></html>
