<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#071c16">
<title>SHOHIN REAL WORLD — Survival</title>
<style>
:root{--bg:#071c16;--panel:#0d3024;--green:#08a56c;--lime:#baf05b;--white:#eef8f1}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--white);font-family:system-ui,Arial;touch-action:none}#game{position:fixed;inset:0}canvas{display:block}
#top{position:fixed;top:env(safe-area-inset-top,8px);left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;z-index:3;pointer-events:none}.brand,.stats{background:#071c16d9;border:1px solid #baf05b55;border-radius:12px;padding:8px 10px;backdrop-filter:blur(8px)}.brand b{font-size:12px;letter-spacing:1.5px;color:var(--lime)}.brand small{display:block;font-size:9px;color:#b8cfc2}.stats{font-size:10px;line-height:1.55;text-align:right}
#bars{position:fixed;top:68px;left:10px;width:148px;z-index:3;background:#071c16c9;border-radius:10px;padding:7px 9px;pointer-events:none}.barline{display:flex;justify-content:space-between;font-size:9px;margin:2px 0}.track{height:5px;background:#ffffff22;border-radius:5px;overflow:hidden}.fill{height:100%;width:100%;border-radius:5px}.health{background:#ef6868}.food{background:#e5b84e}.water{background:#54c5df}
#hint{position:fixed;top:139px;left:50%;transform:translateX(-50%);font-size:10px;color:#e9f5ed;background:#071c16b8;padding:6px 10px;border-radius:20px;white-space:nowrap;pointer-events:none}
#stick{position:fixed;left:18px;bottom:20px;width:112px;height:112px;border-radius:50%;background:#071c1677;border:1px solid #baf05b66;z-index:4;touch-action:none}#nub{position:absolute;width:46px;height:46px;left:32px;top:32px;border-radius:50%;background:#08a56cdd;border:2px solid #baf05b}
#actions{position:fixed;right:14px;bottom:20px;z-index:5;display:flex;flex-direction:column;gap:8px}.act{width:64px;min-height:52px;border:1px solid #baf05b88;border-radius:15px;background:#0d3024ed;color:white;font-size:10px;font-weight:800;touch-action:manipulation}.act.primary{background:#087b53;border-color:#baf05b}.act:active{transform:scale(.96);background:#08a56c}
#bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:4;display:flex;gap:6px;pointer-events:auto}.tab{border:1px solid #baf05b66;background:#071c16eF;color:#eef8f1;padding:9px 12px;border-radius:12px;font-size:10px;font-weight:700}
#panel{position:fixed;z-index:8;left:10px;right:10px;bottom:145px;max-height:48vh;overflow:auto;background:#071c16f2;border:1px solid #08a56c99;border-radius:16px;padding:13px;display:none;backdrop-filter:blur(14px)}#panel.open{display:block}#panel h3{font-size:14px;color:var(--lime);margin:0 0 9px}#panel p{font-size:11px;color:#c6d9ce;margin:5px 0 10px}.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.item{background:#0d3024;border:1px solid #426b59;border-radius:11px;padding:10px;text-align:left;color:white;font-size:11px}.item b{display:block;color:var(--lime);font-size:12px;margin-bottom:4px}.item:disabled{opacity:.38}.close{float:right;background:transparent;border:0;color:#baf05b;font-size:20px}
#toast{position:fixed;left:50%;bottom:205px;transform:translateX(-50%);z-index:12;background:#0d3024ed;border:1px solid #baf05b66;border-radius:12px;padding:10px 13px;font-size:11px;display:none;max-width:86%;text-align:center}
#loading{position:fixed;inset:0;z-index:20;background:#071c16;display:grid;place-items:center;text-align:center;transition:opacity .5s}#loading b{font-size:23px;letter-spacing:4px;color:var(--lime)}#loading span{display:block;color:#b8cfc2;font-size:10px;margin-top:10px;letter-spacing:2px}
@media(min-width:700px){#stick{width:100px;height:100px}#nub{left:27px;top:27px}#panel{max-width:440px;left:auto;right:20px;bottom:110px}}
</style>
</head>
<body>
<div id="game"></div><div id="loading"><div><b>SHOHIN</b><span>ENTERING SURVIVAL WORLD...</span></div></div>
<div id="top"><div class="brand"><b>SHOHIN REAL WORLD</b><small>SURVIVAL • EARLY ACCESS</small></div><div class="stats" id="inventory">Дерево 0 · Камень 0<br>Волокно 0 · День 1</div></div>
<div id="bars">
 <div class="barline"><span>ЗДОРОВЬЕ</span><b id="hpnum">100</b></div><div class="track"><div id="hpbar" class="fill health"></div></div>
 <div class="barline"><span>ГОЛОД</span><b id="foodnum">100</b></div><div class="track"><div id="foodbar" class="fill food"></div></div>
 <div class="barline"><span>ЖАЖДА</span><b id="waternum">100</b></div><div class="track"><div id="waterbar" class="fill water"></div></div>
</div>
<div id="hint">Подойди к дереву или камню и нажми «ДОБЫТЬ»</div>
<div id="stick"><div id="nub"></div></div>
<div id="actions"><button class="act primary" id="use">ДОБЫТЬ</button><button class="act" id="jump">ПРЫЖОК</button></div>
<div id="bottom"><button class="tab" id="bag">РЕСУРСЫ</button><button class="tab" id="craft">КРАФТ</button><button class="tab" id="build">СТРОИТЬ</button></div>
<div id="panel"><button class="close" id="close">×</button><h3 id="paneltitle">РЕСУРСЫ</h3><div id="panelbody"></div></div><div id="toast"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const mount=document.querySelector('#game'),scene=new THREE.Scene();scene.background=new THREE.Color(0x9ac8d0);scene.fog=new THREE.Fog(0x9ac8d0,42,145);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;mount.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdaf4ff,0x526b37,1.8));const sun=new THREE.DirectionalLight(0xfff1d2,2.2);sun.position.set(-35,55,25);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-45;sun.shadow.camera.right=45;sun.shadow.camera.top=45;sun.shadow.camera.bottom=-45;scene.add(sun);
const mat=(c,r=1)=>new THREE.MeshStandardMaterial({color:c,roughness:r}),grass=mat(0x578b45),trunk=mat(0x765039),leaf=mat(0x267448),leaf2=mat(0x398b4d),stone=mat(0x858d82),wood=mat(0x9b6840),wall=mat(0xd8c99d),roof=mat(0x674b3b);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(260,260),grass);ground.rotation.x=-Math.PI/2;ground.position.y=-.15;ground.receiveShadow=true;scene.add(ground);
function tree(x,z,s=1){const g=new THREE.Group(),t=new THREE.Mesh(new THREE.CylinderGeometry(.17*s,.24*s,1.8*s,7),trunk);t.position.y=.9*s;t.castShadow=true;g.add(t);for(let i=0;i<3;i++){const c=new THREE.Mesh(new THREE.ConeGeometry((1.05-i*.12)*s,1.65*s,7),i%2?leaf:leaf2);c.position.y=(1.75+i*.55)*s;c.castShadow=true;g.add(c)}g.position.set(x,0,z);scene.add(g);return g}
function rock(x,z,s=1){const m=new THREE.Mesh(new THREE.DodecahedronGeometry(.7*s,0),stone);m.position.set(x,.35*s,z);m.scale.y=.7;m.castShadow=true;scene.add(m);return m}
const resources=[];for(let i=0;i<95;i++){const x=(Math.random()-.5)*110,z=(Math.random()-.5)*110;if(Math.hypot(x,z)>7)resources.push({kind:'tree',mesh:tree(x,z,.7+Math.random()*.6),alive:true})}for(let i=0;i<75;i++){const x=(Math.random()-.5)*100,z=(Math.random()-.5)*100;if(Math.hypot(x,z)>5)resources.push({kind:'rock',mesh:rock(x,z,.55+Math.random()*.65),alive:true})}
const player=new THREE.Group(),body=new THREE.Mesh(new THREE.CapsuleGeometry(.38,.85,4,8),mat(0x087b53));body.position.y=1;body.castShadow=true;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.27,12,10),mat(0xe0b58c));head.position.y=1.78;player.add(head);const legs=[];for(const x of [-.17,.17]){const l=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.5,3,6),mat(0x253d36));l.position.set(x,.35,0);player.add(l);legs.push(l)}scene.add(player);
const state={wood:0,stone:0,fiber:0,food:2,axe:false,pick:false,hp:100,hunger:100,thirst:100,day:1,elapsed:0,built:[]};
const animals=[];function animal(x,z){const g=new THREE.Group(),fur=mat(0xb77b43);const torso=new THREE.Mesh(new THREE.SphereGeometry(.48,10,8),fur);torso.scale.set(1,.75,1.3);torso.position.y=.7;g.add(torso);const h=new THREE.Mesh(new THREE.SphereGeometry(.2,8,8),fur);h.position.set(0,1.15,.48);g.add(h);for(const sx of [-.22,.22])for(const sz of [-.3,.3]){const l=new THREE.Mesh(new THREE.CylinderGeometry(.05,.06,.45,5),fur);l.position.set(sx,.25,sz);g.add(l)}g.position.set(x,0,z);scene.add(g);animals.push({mesh:g,x,z,p:Math.random()*6})}for(let i=0;i<10;i++)animal((Math.random()-.5)*70,(Math.random()-.5)*70);
const buildings=[];function campfire(x,z){const g=new THREE.Group();const base=new THREE.Mesh(new THREE.CylinderGeometry(.65,.72,.18,8),mat(0x77736b));base.position.y=.1;g.add(base);for(let i=0;i<3;i++){const log=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,1.15,6),wood);log.rotation.z=Math.PI/2;log.rotation.y=i*Math.PI/3;log.position.y=.25;g.add(log)}const flame=new THREE.Mesh(new THREE.ConeGeometry(.28,.8,7),new THREE.MeshBasicMaterial({color:0xff9b32}));flame.position.y=.65;g.add(flame);const light=new THREE.PointLight(0xff8a32,1.5,9);light.position.y=1;g.add(light);g.position.set(x,0,z);scene.add(g);buildings.push(g)}
function hut(x,z){const g=new THREE.Group(),b=new THREE.Mesh(new THREE.BoxGeometry(3.5,2.2,3),wall);b.position.y=1.1;b.castShadow=true;g.add(b);const r=new THREE.Mesh(new THREE.ConeGeometry(2.7,1.5,4),roof);r.rotation.y=Math.PI/4;r.position.y=2.9;g.add(r);const d=new THREE.Mesh(new THREE.BoxGeometry(.75,1.4,.1),wood);d.position.set(0,.7,1.55);g.add(d);g.position.set(x,0,z);scene.add(g);buildings.push(g)}
let yaw=0,pitch=.2,mx=0,my=0,vy=0,onGround=true,walk=0,targetResource=null,nearAnimal=null;const clock=new THREE.Clock();let toastTimer;
function toast(s){const el=document.querySelector('#toast');el.textContent=s;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',2300)}
function updateUI(){document.querySelector('#inventory').innerHTML='Дерево '+state.wood+' · Камень '+state.stone+'<br>Волокно '+state.fiber+' · День '+state.day;for(const [k,v] of [['hp',state.hp],['food',state.hunger],['water',state.thirst]]){document.querySelector('#'+k+'bar').style.width=Math.max(0,v)+'%';document.querySelector('#'+k+'num').textContent=Math.max(0,Math.round(v))}}
function nearest(){let best=null,dist=3.6;for(const r of resources){if(!r.alive)continue;const d=player.position.distanceTo(r.mesh.position);if(d<dist){dist=d;best=r}}return best}
function gather(){const r=nearest();if(!r){toast('Подойди ближе к дереву или камню.');return}r.alive=false;scene.remove(r.mesh);if(r.kind==='tree'){state.wood+=state.axe?5:3;state.fiber+=2;toast('Добыто: древесина и волокно.')}else{state.stone+=state.pick?5:3;toast('Добыто: камень.')}updateUI()}
function openPanel(type){const p=document.querySelector('#panel'),title=document.querySelector('#paneltitle'),body=document.querySelector('#panelbody');p.classList.add('open');if(type==='bag'){title.textContent='ТВОИ РЕСУРСЫ';body.innerHTML='<p>Древесина: '+state.wood+'<br>Камень: '+state.stone+'<br>Волокно: '+state.fiber+'<br>Еда: '+state.food+'<br>Инструменты: '+(state.axe?'Топор ':'')+(state.pick?'Кирка':'')+'</p><p>Ресурсы добываются в мире. Ничего не появляется бесплатно.</p>'}
if(type==='craft'){title.textContent='МАСТЕРСКАЯ — КРАФТ';body.innerHTML='<div class="items"><button class="item" id="makeaxe" '+(state.axe?'disabled':'')+'><b>КАМЕННЫЙ ТОПОР</b>3 дерева · 2 камня<br>Больше древесины</button><button class="item" id="makepick" '+(state.pick?'disabled':'')+'><b>КАМЕННАЯ КИРКА</b>3 дерева · 3 камня<br>Больше камня</button><button class="item" id="makefood" '+(state.food>=8?'disabled':'')+'><b>СОБРАТЬ ЯГОДЫ</b>2 волокна<br>+1 порция еды</button></div>';document.querySelector('#makeaxe').onclick=()=>{if(state.axe)return;if(state.wood>=3&&state.stone>=2){state.wood-=3;state.stone-=2;state.axe=true;toast('Создан каменный топор!')}else toast('Не хватает ресурсов.');updateUI();openPanel('craft')};document.querySelector('#makepick').onclick=()=>{if(state.pick)return;if(state.wood>=3&&state.stone>=3){state.wood-=3;state.stone-=3;state.pick=true;toast('Создана каменная кирка!')}else toast('Не хватает ресурсов.');updateUI();openPanel('craft')};document.querySelector('#makefood').onclick=()=>{if(state.food>=8)return;if(state.fiber>=2){state.fiber-=2;state.food++;toast('Собрана еда.')}else toast('Нужно 2 волокна.');updateUI();openPanel('craft')}}
if(type==='build'){title.textContent='СТРОИТЕЛЬСТВО';body.innerHTML='<p>Строй только из добытых материалов. Постройки размещаются рядом с игроком.</p><div class="items"><button class="item" id="fire"><b>КОСТЁР</b>5 дерева · 3 камня<br>Свет и тепло</button><button class="item" id="hut"><b>ХИЖИНА</b>14 дерева · 8 камня<br>Первое укрытие</button></div>';document.querySelector('#fire').onclick=()=>{if(state.wood>=5&&state.stone>=3){state.wood-=5;state.stone-=3;const x=player.position.x+Math.sin(yaw)*3,z=player.position.z+Math.cos(yaw)*3;campfire(x,z);toast('Костёр построен.')}else toast('Нужно 5 дерева и 3 камня.');updateUI();openPanel('build')};document.querySelector('#hut').onclick=()=>{if(state.wood>=14&&state.stone>=8){state.wood-=14;state.stone-=8;const x=player.position.x+Math.sin(yaw)*5,z=player.position.z+Math.cos(yaw)*5;hut(x,z);toast('Хижина построена!')}else toast('Нужно 14 дерева и 8 камня.');updateUI();openPanel('build')}}
}
document.querySelector('#bag').onclick=()=>openPanel('bag');document.querySelector('#craft').onclick=()=>openPanel('craft');document.querySelector('#build').onclick=()=>openPanel('build');document.querySelector('#close').onclick=()=>document.querySelector('#panel').classList.remove('open');document.querySelector('#use').onclick=gather;document.querySelector('#jump').onclick=()=>{if(onGround){vy=7;onGround=false}};
const stick=document.querySelector('#stick'),nub=document.querySelector('#nub');let stickId=null;function stickMove(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy),max=36;if(d>max){dx=dx/d*max;dy=dy/d*max}nub.style.transform='translate('+dx+'px,'+dy+'px)';mx=dx/max;my=dy/max}stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture(stickId);stickMove(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)stickMove(e)});function stop(){stickId=null;mx=my=0;nub.style.transform='translate(0,0)'}stick.addEventListener('pointerup',stop);stick.addEventListener('pointercancel',stop);
let lookId=null,lx=0,ly=0;renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX>innerWidth*.32){lookId=e.pointerId;lx=e.clientX;ly=e.clientY}});renderer.domElement.addEventListener('pointermove',e=>{if(lookId===e.pointerId){yaw-=(e.clientX-lx)*.005;pitch=Math.max(-.05,Math.min(.8,pitch+(e.clientY-ly)*.003));lx=e.clientX;ly=e.clientY}});renderer.domElement.addEventListener('pointerup',e=>{if(lookId===e.pointerId)lookId=null});renderer.domElement.addEventListener('pointercancel',()=>lookId=null);
addEventListener('keydown',e=>{if(e.code==='KeyW'||e.code==='ArrowUp')my=-1;if(e.code==='KeyS'||e.code==='ArrowDown')my=1;if(e.code==='KeyA'||e.code==='ArrowLeft')mx=-1;if(e.code==='KeyD'||e.code==='ArrowRight')mx=1;if(e.code==='Space'&&onGround){vy=7;onGround=false}});addEventListener('keyup',e=>{if(['KeyW','ArrowUp','KeyS','ArrowDown'].includes(e.code))my=0;if(['KeyA','ArrowLeft','KeyD','ArrowRight'].includes(e.code))mx=0});
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04),t=clock.elapsedTime;const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw)),dir=forward.clone().multiplyScalar(-my).add(right.multiplyScalar(mx));if(dir.lengthSq()>1)dir.normalize();if(dir.lengthSq()>.001){player.position.addScaledVector(dir,4.8*dt);player.rotation.y=Math.atan2(dir.x,dir.z);walk+=dt*9}else walk=0;vy-=18*dt;player.position.y+=vy*dt;if(player.position.y<0){player.position.y=0;vy=0;onGround=true}legs[0].rotation.x=Math.sin(walk)*.6;legs[1].rotation.x=-Math.sin(walk)*.6;
targetResource=nearest();document.querySelector('#use').textContent=targetResource?(targetResource.kind==='tree'?'РУБИТЬ':'ДОБЫТЬ'):'ДОБЫТЬ';
for(const a of animals){a.p+=dt*.35;a.mesh.position.x=a.x+Math.sin(a.p)*1.6;a.mesh.position.z=a.z+Math.cos(a.p*.8)*1.6;a.mesh.rotation.y=Math.atan2(Math.cos(a.p),-Math.sin(a.p*.8))}
state.elapsed+=dt;if(state.elapsed>45){state.elapsed=0;state.day++;}state.hunger=Math.max(0,state.hunger-dt*.11);state.thirst=Math.max(0,state.thirst-dt*.18);if(state.hunger===0||state.thirst===0)state.hp=Math.max(0,state.hp-dt*.8);if(state.hp<=0){toast('Ты потерял сознание. Перезапусти мир для новой попытки.');state.hp=1}
const cycle=(Math.sin((state.elapsed/45)*Math.PI*2-Math.PI/2)+1)/2;sun.intensity=.35+cycle*2;scene.background.setRGB(.035+cycle*.55,.07+cycle*.63,.12+cycle*.65);scene.fog.color.copy(scene.background);
const target=new THREE.Vector3(player.position.x,player.position.y+1.3,player.position.z),offset=new THREE.Vector3(Math.sin(yaw)*7,3.3+pitch*2,Math.cos(yaw)*7);camera.position.lerp(target.clone().add(offset),1-Math.pow(.001,dt));camera.lookAt(target);updateUI();renderer.render(scene,camera)}
animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5))});setTimeout(()=>{const l=document.querySelector('#loading');l.style.opacity='0';setTimeout(()=>l.remove(),550);toast('Выживай: добывай дерево и камень, создавай инструменты и строй укрытие.');},800);
</script></body></html>
